[package]
name = "radio_browser_plus"
version = "1.0.0"
edition = "2021"
authors = ["Radio Browser Plus"]
description = "Rust backend for Radio Browser Plus web app"

[[bin]]
name = "radio_browser_plus"
path = "src/main.rs"

[dependencies]
# Web framework and async runtime
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for external API calls
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
hyper = { version = "1", features = ["full"] }
urlencoding = "2.1"
bcrypt = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
