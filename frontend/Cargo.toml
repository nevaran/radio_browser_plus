[package]
name = "radio-browser-plus-frontend"
version = "1.2.0"
edition = "2021"
description = "Leptos WebAssembly frontend for Radio Browser Plus (CSR, talks to the Axum JSON API)"

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
gloo-net = { version = "0.8.0", features = ["http"] }
gloo-timers = { version = "0.4.1", features = ["futures"] }
gloo-storage = "0.4.1"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.107", features = [
    "Window",
    "Navigator",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "Location",
    "KeyboardEvent",
    "NodeList",
    "RequestCredentials",
] }
