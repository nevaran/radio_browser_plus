[package]
name = "radio-browser-plus-frontend"
version = "1.0.0"
edition = "2021"
description = "Leptos WebAssembly frontend for Radio Browser Plus (CSR, talks to the Axum JSON API)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-storage = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "Location",
    "KeyboardEvent",
    "RequestCredentials",
] }
