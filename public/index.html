<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Browser Plus</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-base-path="">
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Radio Browser Plus</h1>
        <div class="nav-group">
          <button class="nav" data-view="all">All stations</button>
          <button class="nav" data-view="popular">Popular</button>
          <button class="nav" data-view="favorites">Favorites</button>
          <button class="nav" data-view="countries">Countries</button>
          <button class="nav" data-view="languages">Languages</button>
          <button class="nav" data-view="genres">Genres</button>
        </div>

        <div class="search-box">
          <div class="section-divider">Search</div>
          <input id="search" type="search" placeholder="Search stations..." />
          <button id="search-btn">Search</button>
        </div>

        <div class="sidebar-separator"></div>

        <div class="side-actions-section">
          <div class="section-divider">Account</div>
          <div id="account-actions" class="account-actions">
            <button id="login-button" class="side-action">Login</button>
            <button id="logout-button" class="side-action hidden">Logout</button>
            <button id="change-password-button" class="side-action hidden">Change Password</button>
          </div>
        </div>

        <div id="admin-actions" class="side-actions-section hidden">
          <div class="section-divider">Admin</div>
          <button id="create-user-button" class="side-action side-action-half admin-side-action">Create User</button>
        </div>
      </aside>

      <main class="content">
        <div class="toolbar">
          <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
          <h2 id="view-title">Popular</h2>
        </div>
        <div id="station-grid" class="station-grid"></div>

        <div id="now-playing-bar" class="now-playing-bar hidden">
          <div class="now-playing-main-row">
            <div class="now-playing-left">
              <button id="favorite-current" class="favorite-current" title="Add to favorites" aria-label="Toggle favorite">☆</button>
              <div class="now-playing-icon-section">
                <img id="now-playing-icon" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIzMiIgZmlsbD0iIzJkMzU0OCIvPjxwYXRoIGQ9Ik0zMiAxNkMxNiAxNiAxNiAzMiAxNiA0OEgxNkMxNiAzMiAyNCAzMiAzMiAzMkM0MCAzMiA0OCAzMiA0OCA0OEg0OEM0OCAzMiA0OCAxNiAzMiAxNloiIGZpbGw9IiM5Y2EzYWYiLz48L3N2Zz4=" alt="Station" />
              </div>
              <div class="now-playing-status" aria-label="Station quality indicator">
                <div id="now-playing-status-bar" class="now-playing-status-bar"></div>
              </div>
              <div class="now-playing-meta">
                <div class="now-playing-name" id="now-playing-name">Nothing playing</div>
                <div class="now-playing-details">
                  <span id="now-playing-country">Unknown</span>
                  <span class="separator">·</span>
                  <span id="now-playing-genre">Unknown genre</span>
                  <span class="separator">·</span>
                  <span id="now-playing-bitrate">Stream</span>
                </div>
              </div>
            </div>

            <div class="play-stop-container">
              <button id="play-stop-btn" aria-label="Stop playback" title="Stop">■</button>
              <div id="loading-spinner" class="loading-spinner hidden"></div>
            </div>

            <div class="now-playing-controls">
              <div class="volume-control">
                <button id="volume-icon" class="volume-icon" title="Mute/Unmute" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.3rem;">🔊</button>
                <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" />
                <span id="volume-display" class="volume-display">100%</span>
              </div>
            </div>
          </div>

          <div class="now-playing-meta-row">
            <div class="now-playing-meta">
              <div class="now-playing-name" id="now-playing-name-mobile">Nothing playing</div>
              <div class="now-playing-details">
                <span id="now-playing-country-mobile">Unknown</span>
                <span class="separator">·</span>
                <span id="now-playing-genre-mobile">Unknown genre</span>
                <span class="separator">·</span>
                <span id="now-playing-bitrate-mobile">Stream</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="login-modal" class="auth-modal hidden" aria-hidden="true">
      <div class="auth-modal-backdrop"></div>
      <div class="auth-modal-content" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
        <div class="auth-modal-header">
          <h3 id="login-modal-title">Sign in</h3>
          <button type="button" class="auth-close" data-close="login-modal" aria-label="Close">×</button>
        </div>
        <form id="login-form" class="auth-form">
          <label>
            <span>Username</span>
            <input id="login-username" name="username" type="text" autocomplete="username" required />
          </label>
          <label>
            <span>Password</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="primary-button">Login</button>
        </form>
      </div>
    </div>

    <div id="create-user-modal" class="auth-modal hidden" aria-hidden="true">
      <div class="auth-modal-backdrop"></div>
      <div class="auth-modal-content" role="dialog" aria-modal="true" aria-labelledby="create-user-modal-title">
        <div class="auth-modal-header">
          <h3 id="create-user-modal-title">Create User</h3>
          <button type="button" class="auth-close" data-close="create-user-modal" aria-label="Close">×</button>
        </div>
        <form id="create-user-form" class="auth-form">
          <label>
            <span>Username</span>
            <input id="create-user-username" name="username" type="text" autocomplete="username" required />
          </label>
          <label>
            <span>Password</span>
            <input id="create-user-password" name="password" type="password" autocomplete="new-password" required />
          </label>
          <label>
            <span>Role</span>
            <select id="create-user-role" name="role">
              <option value="listener">Listener</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button type="submit" class="primary-button">Create User</button>
        </form>
      </div>
    </div>

    <div id="change-password-modal" class="auth-modal hidden" aria-hidden="true">
      <div class="auth-modal-backdrop"></div>
      <div class="auth-modal-content" role="dialog" aria-modal="true" aria-labelledby="change-password-modal-title">
        <div class="auth-modal-header">
          <h3 id="change-password-modal-title">Change Password</h3>
          <button type="button" class="auth-close" data-close="change-password-modal" aria-label="Close">×</button>
        </div>
        <form id="change-password-form" class="auth-form">
          <label>
            <span>Current Password</span>
            <input id="change-current-password" name="old_password" type="password" autocomplete="current-password" required />
          </label>
          <label>
            <span>New Password</span>
            <input id="change-new-password" name="new_password" type="password" autocomplete="new-password" required />
          </label>
          <button type="submit" class="primary-button">Update Password</button>
        </form>
      </div>
    </div>

    <template id="station-card-template">
      <article class="station-card">
        <button class="favorite-button" data-favorite="" aria-label="Toggle favorite"></button>
        <div class="card-art">
          <img alt="" loading="lazy" decoding="async" />
        </div>
        <div>
          <div class="station-name"></div>
          <div class="station-meta"></div>
        </div>
      </article>
    </template>

    <template id="collection-card-template">
      <article class="station-card">
        <div class="card-art">
          <img alt="" />
        </div>
        <div>
          <div class="station-name"></div>
          <div class="station-meta"></div>
        </div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
